[package]
name = "editogether-collab"
version = "0.1.0"
edition = "2021"
description = "Local self-hosted collaboration relay for EdiTogether"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"

[dev-dependencies]
tokio-tungstenite = "0.26"
futures-util = "0.3"
